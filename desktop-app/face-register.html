<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng ký Face ID</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        user-select: none;
      }

      .wrap {
        width: 100%;
        max-width: 420px;
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 16px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 100px;
        font-size: 12px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.8);
      }

      .badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #0a84ff;
        box-shadow: 0 0 8px rgba(10, 132, 255, 0.8);
      }

      .badge .count {
        color: #fff;
        font-weight: 700;
      }

      .cam-zone {
        position: relative;
        width: 240px;
        height: 240px;
        margin: 4px 0;
      }

      .cam-ring {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .cam-ring-2 {
        position: absolute;
        inset: -28px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.03);
      }

      .cam-circle {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        background: #050505;
        border: 2px solid rgba(10, 132, 255, 0.4);
        box-shadow: 0 0 60px rgba(10, 132, 255, 0.15);
        transition:
          border-color 0.35s,
          box-shadow 0.35s;
      }

      .cam-circle.scanning {
        border-color: rgba(10, 132, 255, 0.7);
        box-shadow: 0 0 80px rgba(10, 132, 255, 0.3);
      }

      .cam-circle.ready {
        border-color: #30d158;
        box-shadow: 0 0 100px rgba(48, 209, 88, 0.5);
      }

      .cam-circle.warning {
        border-color: #ffd60a;
        box-shadow: 0 0 80px rgba(255, 214, 10, 0.35);
      }

      .cam-circle.success {
        border-color: #30d158;
        box-shadow: 0 0 120px rgba(48, 209, 88, 0.6);
      }

      #camera,
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #camera {
        transform: scaleX(-1);
      }
      #overlay {
        transform: scaleX(-1);
        pointer-events: none;
        z-index: 2;
      }

      .scan-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(10, 132, 255, 0.9),
          transparent
        );
        box-shadow: 0 0 16px rgba(10, 132, 255, 0.7);
        z-index: 4;
        opacity: 0;
      }

      .scan-line.on {
        opacity: 1;
        animation: scanDown 2s ease-in-out infinite;
      }

      @keyframes scanDown {
        0% {
          top: 6%;
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          top: 94%;
          opacity: 0;
        }
      }

      .brightness-warn {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 214, 10, 0.95);
        color: #000;
        padding: 6px 14px;
        border-radius: 100px;
        font-size: 11px;
        font-weight: 600;
        display: none;
        z-index: 10;
        white-space: nowrap;
      }

      .brightness-warn.on {
        display: block;
      }

      .status-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        min-height: 50px;
      }

      .status {
        font-size: 14px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.7);
        text-align: center;
        max-width: 340px;
        line-height: 1.4;
        transition: color 0.25s;
      }

      .status.success {
        color: #30d158;
      }
      .status.error {
        color: #ff453a;
      }
      .status.warning {
        color: #ffd60a;
      }

      .progress {
        width: 160px;
        height: 4px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 100px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #0a84ff, #30d158);
        border-radius: 100px;
        transition: width 0.12s linear;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 300px;
        margin-top: 4px;
      }

      .btn {
        padding: 13px 24px;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition:
          background 0.2s,
          transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn-primary {
        background: linear-gradient(135deg, #0a84ff, #0066cc);
        color: #fff;
        box-shadow: 0 4px 18px rgba(10, 132, 255, 0.4);
      }

      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #1a94ff, #0077dd);
      }

      .btn-primary:disabled {
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.3);
        cursor: not-allowed;
        box-shadow: none;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .success-view {
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 30px 20px;
        gap: 20px;
      }

      .success-view.on {
        display: flex;
      }

      .check-circle {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(48, 209, 88, 0.15);
        border: 2px solid #30d158;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 70px rgba(48, 209, 88, 0.5);
      }

      .check-circle svg {
        width: 50px;
        height: 50px;
        stroke: #30d158;
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .success-title {
        font-size: 22px;
        font-weight: 700;
        color: #30d158;
      }

      .success-msg {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
        text-align: center;
        line-height: 1.5;
        max-width: 280px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="registerView" style="display: contents">
        <div class="badge">
          <span>HAB CREATIVE</span>
        </div>

        <div class="cam-zone">
          <div class="cam-ring"></div>
          <div class="cam-ring-2"></div>
          <div class="cam-circle scanning" id="cameraCircle">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
            <div class="scan-line on" id="scanLine"></div>
          </div>
          <div class="brightness-warn" id="brightnessWarning">Ánh sáng yếu</div>
        </div>

        <div class="status-box">
          <div class="status" id="status">Đang khởi tạo...</div>
          <div class="progress">
            <div class="progress-fill" id="progressBar"></div>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="captureBtn" disabled>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
              />
              <circle cx="12" cy="13" r="4" />
            </svg>
            Bắt đầu quét
          </button>
          <button class="btn btn-secondary" id="cancelBtn">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M18 6L6 18M6 6l12 12" />
            </svg>
            Hủy
          </button>
        </div>
      </div>

      <div class="success-view" id="successView">
        <div class="check-circle">
          <svg viewBox="0 0 24 24">
            <path d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <div class="success-title" id="successTitle">Đã đăng ký</div>
        <div class="success-msg" id="successMessage">
          Khuôn mặt đã được lưu an toàn trên thiết bị
        </div>
      </div>
    </div>

    <script src="./node_modules/@tensorflow/tfjs/dist/tf.min.js"></script>
    <script src="./node_modules/face-api.js/dist/face-api.min.js"></script>
    <script src="./face-shared.js"></script>
    <script src="./face-register.js"></script>
  </body>
</html>
