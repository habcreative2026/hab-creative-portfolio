<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng ký Face ID</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0a0a0f;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        user-select: none;
        overflow: hidden;
      }

      .container {
        width: 100%;
        max-width: 720px;
        padding: 25px;
        text-align: center;
      }

      .header {
        margin-bottom: 15px;
      }

      .header h1 {
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(135deg, #e94560, #ff6b6b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 4px;
      }

      .header p {
        font-size: 12px;
        color: #64748b;
      }

      /* TYPE SELECTOR - 3 cards */
      .type-selector {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .type-card {
        flex: 1;
        max-width: 180px;
        padding: 14px 10px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        border: 2px solid rgba(255, 255, 255, 0.08);
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
      }

      .type-card:hover:not(.disabled) {
        border-color: rgba(233, 69, 96, 0.5);
        background: rgba(233, 69, 96, 0.05);
        transform: translateY(-2px);
      }

      .type-card.active {
        border-color: #e94560;
        background: rgba(233, 69, 96, 0.15);
        box-shadow: 0 0 20px rgba(233, 69, 96, 0.2);
      }

      .type-card.disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .type-emoji {
        font-size: 28px;
        margin-bottom: 5px;
      }

      .type-label {
        font-size: 12px;
        font-weight: 600;
        color: #e2e8f0;
        margin-bottom: 4px;
      }

      .type-status {
        font-size: 10px;
        color: #64748b;
      }

      .type-card.active .type-status {
        color: #e94560;
      }

      /* CAMERA */
      .camera-container {
        position: relative;
        width: 100%;
        max-width: 400px;
        aspect-ratio: 4/3;
        margin: 0 auto 15px;
        border-radius: 18px;
        overflow: hidden;
        background: #1a1a24;
      }

      #camera,
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      #camera {
        object-fit: cover;
        transform: scaleX(-1);
      }

      #overlay {
        transform: scaleX(-1);
        pointer-events: none;
      }

      /* PROGRESS */
      .progress-section {
        margin-bottom: 15px;
      }

      .progress-label {
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 6px;
        min-height: 18px;
      }

      .progress-bar-bg {
        width: 100%;
        max-width: 360px;
        height: 5px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 100px;
        margin: 0 auto;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #e94560, #ff6b6b);
        border-radius: 100px;
        transition: width 0.4s ease;
      }

      .status {
        font-size: 13px;
        min-height: 20px;
        margin-bottom: 15px;
        color: #94a3b8;
        font-weight: 500;
      }

      .status.success {
        color: #10b981;
        font-weight: 600;
      }
      .status.error {
        color: #ef4444;
      }
      .status.warning {
        color: #f59e0b;
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }

      .btn {
        padding: 11px 22px;
        border: none;
        border-radius: 11px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }

      .btn-primary {
        background: linear-gradient(135deg, #e94560, #ff6b6b);
        color: white;
        box-shadow: 0 4px 20px rgba(233, 69, 96, 0.3);
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(233, 69, 96, 0.4);
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #94a3b8;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }

      /* SUCCESS */
      .success-view {
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }

      .success-view.visible {
        display: flex;
      }

      .success-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.1);
        border: 2px solid #10b981;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        animation: popIn 0.5s ease;
      }

      .success-icon svg {
        width: 40px;
        height: 40px;
        color: #10b981;
      }

      @keyframes popIn {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .success-view h2 {
        font-size: 22px;
        color: #10b981;
        margin-bottom: 8px;
      }

      .success-view p {
        font-size: 13px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="registerView">
        <div class="header">
          <h1>Đăng ký Face ID</h1>
          <p>Chọn loại khuôn mặt bạn muốn đăng ký</p>
        </div>

        <!-- TYPE SELECTOR - 3 cards -->
        <div class="type-selector" id="typeSelector">
          <div class="type-card" data-type="noMask" id="cardNoMask">
            <div class="type-emoji">😊</div>
            <div class="type-label">Không khẩu trang</div>
            <div class="type-status" id="statusNoMask">Chưa đăng ký</div>
          </div>
          <div class="type-card" data-type="withMask" id="cardWithMask">
            <div class="type-emoji">😷</div>
            <div class="type-label">Có khẩu trang</div>
            <div class="type-status" id="statusWithMask">Chưa đăng ký</div>
          </div>
          <div class="type-card" data-type="withGlasses" id="cardWithGlasses">
            <div class="type-emoji">👓</div>
            <div class="type-label">Đeo kính</div>
            <div class="type-status" id="statusWithGlasses">Chưa đăng ký</div>
          </div>
        </div>

        <div class="camera-container">
          <video id="camera" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
        </div>

        <div class="progress-section">
          <div class="progress-label" id="progressLabel">Đang khởi tạo...</div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
          </div>
        </div>

        <div class="status" id="status">Đang tải model AI...</div>

        <div class="actions">
          <button class="btn btn-secondary" id="cancelBtn">Hủy</button>
          <button class="btn btn-primary" id="captureBtn" disabled>
            Chụp khuôn mặt
          </button>
        </div>
      </div>

      <div class="success-view" id="successView">
        <div class="success-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="3"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
        <h2 id="successTitle">Đăng ký thành công!</h2>
        <p id="successMessage">Face ID đã được lưu trên thiết bị của bạn</p>
      </div>
    </div>

    <script src="./node_modules/@tensorflow/tfjs/dist/tf.min.js"></script>
    <script src="./node_modules/face-api.js/dist/face-api.min.js"></script>
    <script src="./face-shared.js"></script>
    <script src="./face-register.js"></script>
  </body>
</html>
