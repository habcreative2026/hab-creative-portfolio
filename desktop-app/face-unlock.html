<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Mở khóa</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        user-select: none;
      }

      .wrap {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .app-icon {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        background: linear-gradient(135deg, #0a84ff, #0066cc);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 28px rgba(10, 132, 255, 0.35);
        transition: all 0.4s ease;
      }

      .app-icon.unlocked {
        background: linear-gradient(135deg, #30d158, #1a9e3d);
        box-shadow: 0 8px 28px rgba(48, 209, 88, 0.4);
      }

      .app-icon svg {
        width: 26px;
        height: 26px;
        stroke: #fff;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .title {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.3px;
        transition: color 0.3s;
      }

      .title.unlocked {
        color: #30d158;
      }

      .subtitle {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.45);
        text-align: center;
        margin-top: -12px;
        line-height: 1.4;
        max-width: 300px;
      }

      .cam-zone {
        position: relative;
        width: 220px;
        height: 220px;
        margin: 8px 0;
      }

      .cam-ring {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .cam-ring-2 {
        position: absolute;
        inset: -28px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.03);
      }

      .cam-circle {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        background: #050505;
        border: 2px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 60px rgba(10, 132, 255, 0.12);
        transition:
          border-color 0.35s,
          box-shadow 0.35s;
      }

      .cam-circle.scanning {
        border-color: rgba(10, 132, 255, 0.6);
        box-shadow: 0 0 80px rgba(10, 132, 255, 0.25);
      }

      .cam-circle.success {
        border-color: #30d158;
        box-shadow: 0 0 100px rgba(48, 209, 88, 0.5);
      }

      .cam-circle.warning {
        border-color: #ffd60a;
        box-shadow: 0 0 80px rgba(255, 214, 10, 0.35);
      }

      #camera,
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #camera {
        transform: scaleX(-1);
      }
      #overlay {
        transform: scaleX(-1);
        pointer-events: none;
      }

      .scan-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(10, 132, 255, 0.9),
          transparent
        );
        box-shadow: 0 0 16px rgba(10, 132, 255, 0.7);
        z-index: 4;
        opacity: 0;
      }

      .scan-line.on {
        opacity: 1;
        animation: scanDown 2.2s ease-in-out infinite;
      }

      @keyframes scanDown {
        0% {
          top: 6%;
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          top: 94%;
          opacity: 0;
        }
      }

      .brightness-warn {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 214, 10, 0.95);
        color: #000;
        padding: 6px 14px;
        border-radius: 100px;
        font-size: 11px;
        font-weight: 600;
        display: none;
        z-index: 10;
        white-space: nowrap;
      }

      .brightness-warn.on {
        display: block;
      }

      .status {
        font-size: 14px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.7);
        min-height: 20px;
        text-align: center;
        max-width: 320px;
        line-height: 1.4;
        transition: color 0.25s;
      }

      .status.success {
        color: #30d158;
      }
      .status.error {
        color: #ff453a;
      }
      .status.warning {
        color: #ffd60a;
      }

      .dots {
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        transition: all 0.25s;
      }

      .dot.failed {
        background: #ff453a;
        border-color: #ff453a;
        box-shadow: 0 0 10px rgba(255, 69, 58, 0.6);
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 300px;
        margin-top: 4px;
      }

      .btn {
        padding: 13px 24px;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition:
          background 0.2s,
          transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn-google {
        display: none;
        background: #fff;
        color: #1a1a1a;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      }

      .btn-google.on {
        display: flex;
      }

      .btn-google:hover {
        background: #f0f0f0;
      }

      .btn-google svg {
        width: 18px;
        height: 18px;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .success-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 100;
      }

      .success-overlay.on {
        display: flex;
      }

      .check-circle {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: rgba(48, 209, 88, 0.15);
        border: 2px solid #30d158;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 80px rgba(48, 209, 88, 0.5);
      }

      .check-circle svg {
        width: 55px;
        height: 55px;
        stroke: #30d158;
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .success-overlay h2 {
        font-size: 24px;
        font-weight: 700;
        color: #30d158;
      }

      .success-overlay p {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="cam-zone">
        <div class="cam-ring"></div>
        <div class="cam-ring-2"></div>
        <div class="cam-circle scanning" id="cameraContainer">
          <video id="camera" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div class="scan-line on" id="scanLine"></div>
        </div>
        <div class="brightness-warn" id="brightnessWarning">Ánh sáng yếu</div>
      </div>

      <div class="status" id="status">Đang khởi tạo...</div>

      <div class="dots" id="attemptsIndicator">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="actions">
        <button class="btn btn-google" id="googleBtn">
          <svg viewBox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>
          Đăng nhập bằng Google
        </button>

        <button class="btn btn-secondary" id="quitBtn">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
          Thoát
        </button>
      </div>
    </div>

    <div class="success-overlay" id="successOverlay">
      <div class="check-circle">
        <svg viewBox="0 0 24 24">
          <path d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h2>Đã mở khóa</h2>
      <p>Đang mở ứng dụng...</p>
    </div>

    <script>
      (async function () {
        let libs = {
          tf: "./node_modules/@tensorflow/tfjs/dist/tf.min.js",
          faceApi: "./node_modules/face-api.js/dist/face-api.min.js",
        };

        try {
          if (window.electronAPI?.getLibsPath) {
            libs = await window.electronAPI.getLibsPath();
            console.log("[Unlock] Libs paths:", libs);
          }
        } catch (err) {
          console.error("[Unlock] Cannot get libs path:", err);
        }

        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = libs.tf;
          script.onload = () => {
            console.log("[Unlock] ✅ Loaded tf.min.js");
            resolve();
          };
          script.onerror = () => reject(new Error("Failed to load tf.min.js"));
          document.head.appendChild(script);
        });

        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = libs.faceApi;
          script.onload = () => {
            console.log("[Unlock] ✅ Loaded face-api.min.js");
            resolve();
          };
          script.onerror = () =>
            reject(new Error("Failed to load face-api.min.js"));
          document.head.appendChild(script);
        });

        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "./face-shared.js";
          script.onload = resolve;
          script.onerror = () =>
            reject(new Error("Failed to load face-shared.js"));
          document.body.appendChild(script);
        });

        const scriptUnlock = document.createElement("script");
        scriptUnlock.src = "./face-unlock.js";
        document.body.appendChild(scriptUnlock);
      })();
    </script>
  </body>
</html>
