<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Mở khóa bằng Face ID</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0a0a0f;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        user-select: none;
        overflow: hidden;
      }

      .bg-glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        pointer-events: none;
        z-index: 0;
      }

      .bg-glow-1 {
        width: 500px;
        height: 500px;
        top: -200px;
        left: -150px;
        background: rgba(233, 69, 96, 0.08);
      }

      .bg-glow-2 {
        width: 400px;
        height: 400px;
        bottom: -150px;
        right: -100px;
        background: rgba(255, 107, 107, 0.06);
      }

      .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 480px;
        padding: 30px;
        text-align: center;
        animation: fadeIn 0.4s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header {
        margin-bottom: 25px;
      }

      .lock-icon {
        width: 60px;
        height: 60px;
        margin: 0 auto 15px;
        border-radius: 50%;
        background: rgba(233, 69, 96, 0.1);
        border: 2px solid rgba(233, 69, 96, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .lock-icon.unlocked {
        background: rgba(16, 185, 129, 0.15);
        border-color: #10b981;
        box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
      }

      .lock-icon svg {
        width: 28px;
        height: 28px;
        color: #e94560;
        transition: color 0.3s ease;
      }

      .lock-icon.unlocked svg {
        color: #10b981;
      }

      .header h1 {
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(135deg, #e94560, #ff6b6b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
      }

      .header h1.unlocked {
        background: linear-gradient(135deg, #10b981, #34d399);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .header p {
        font-size: 13px;
        color: #64748b;
      }

      /* CAMERA - có pulse ring */
      .camera-container {
        position: relative;
        width: 100%;
        max-width: 380px;
        aspect-ratio: 4/3;
        margin: 0 auto 20px;
        border-radius: 20px;
        overflow: hidden;
        background: #1a1a24;
        transition: all 0.3s ease;
      }

      .camera-container.success {
        box-shadow: 0 0 50px rgba(16, 185, 129, 0.4);
      }

      #camera,
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      #camera {
        object-fit: cover;
        transform: scaleX(-1);
      }

      #overlay {
        transform: scaleX(-1);
        pointer-events: none;
      }

      /* Brightness warning */
      .brightness-warning {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(245, 158, 11, 0.9);
        color: #fff;
        padding: 6px 14px;
        border-radius: 100px;
        font-size: 11px;
        font-weight: 600;
        display: none;
        align-items: center;
        gap: 6px;
        z-index: 10;
        backdrop-filter: blur(10px);
      }

      .brightness-warning.visible {
        display: flex;
        animation: slideUp 0.3s ease;
      }

      @keyframes slideUp {
        from {
          transform: translate(-50%, 10px);
          opacity: 0;
        }
        to {
          transform: translate(-50%, 0);
          opacity: 1;
        }
      }

      .status {
        font-size: 14px;
        min-height: 22px;
        margin-bottom: 20px;
        color: #94a3b8;
        font-weight: 500;
        transition: color 0.3s ease;
      }

      .status.success {
        color: #10b981;
        font-weight: 600;
      }
      .status.error {
        color: #ef4444;
      }
      .status.warning {
        color: #f59e0b;
      }

      .attempts {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 20px;
      }

      .attempt-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s;
      }

      .attempt-dot.failed {
        background: #ef4444;
        border-color: #ef4444;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }

      .btn {
        padding: 11px 24px;
        border: none;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #94a3b8;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }

      .btn-google {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 24px;
        background: white;
        color: #374151;
        border: none;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        display: none;
      }

      .btn-google.visible {
        display: flex;
        animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      }

      .btn-google:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
      }

      .btn-google svg {
        width: 18px;
        height: 18px;
      }

      .success-overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 15, 0.95);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        animation: fadeIn 0.3s ease;
      }

      .success-overlay.visible {
        display: flex;
      }

      .check-circle {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.15);
        border: 3px solid #10b981;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        box-shadow: 0 0 60px rgba(16, 185, 129, 0.5);
      }

      .check-circle svg {
        width: 50px;
        height: 50px;
        color: #10b981;
      }

      @keyframes popIn {
        0% {
          transform: scale(0.3);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .success-overlay h2 {
        font-size: 24px;
        color: #10b981;
        margin-bottom: 8px;
        font-weight: 700;
      }

      .success-overlay p {
        font-size: 14px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
      <div class="header">
        <div class="lock-icon" id="lockIcon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
            />
          </svg>
        </div>
        <h1 id="title">Face ID</h1>
        <p id="subtitle">Nhìn vào camera để mở khóa</p>
      </div>

      <div class="camera-container" id="cameraContainer">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>

        <!-- 🆕 Brightness warning -->
        <div class="brightness-warning" id="brightnessWarning">
          💡 Ánh sáng yếu - Bật đèn để nhận diện tốt hơn
        </div>
      </div>

      <div class="status" id="status">Đang khởi tạo...</div>

      <div class="attempts" id="attemptsIndicator">
        <div class="attempt-dot" data-attempt="1"></div>
        <div class="attempt-dot" data-attempt="2"></div>
        <div class="attempt-dot" data-attempt="3"></div>
        <div class="attempt-dot" data-attempt="4"></div>
        <div class="attempt-dot" data-attempt="5"></div>
      </div>

      <div class="actions">
        <button class="btn-google" id="googleBtn">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>
          Đăng nhập bằng Google
        </button>

        <button class="btn btn-secondary" id="quitBtn">Thoát ứng dụng</button>
      </div>
    </div>

    <div class="success-overlay" id="successOverlay">
      <div class="check-circle">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="3"
            d="M5 13l4 4L19 7"
          />
        </svg>
      </div>
      <h2>Đã mở khóa</h2>
      <p>Đang mở ứng dụng...</p>
    </div>

    <script src="./node_modules/@tensorflow/tfjs/dist/tf.min.js"></script>
    <script src="./node_modules/face-api.js/dist/face-api.min.js"></script>
    <script src="./face-shared.js"></script>
    <script src="./face-unlock.js"></script>
  </body>
</html>
