<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Face ID Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0a0a0f;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        user-select: none;
      }

      .container {
        position: relative;
        width: 640px;
        height: 480px;
      }

      #camera,
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 20px;
      }

      #camera {
        object-fit: cover;
        transform: scaleX(-1); /* Mirror cho selfie */
        background: #1a1a24;
      }

      #overlay {
        transform: scaleX(-1); /* Mirror theo camera */
        pointer-events: none;
      }

      .status-bar {
        position: absolute;
        bottom: -60px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 14px;
        color: #94a3b8;
      }

      .status-bar.error {
        color: #ef4444;
      }
      .status-bar.success {
        color: #10b981;
      }

      .top-bar {
        position: absolute;
        top: -50px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="top-bar">Face ID Test - Nhìn vào camera</div>
      <video id="camera" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="status-bar" id="status">Đang khởi tạo...</div>
    </div>

    <script src="./node_modules/face-api.js/dist/face-api.min.js"></script>
    <script src="./node_modules/@tensorflow/tfjs/dist/tf.min.js"></script>
    <script src="./face-test.js"></script>
  </body>
</html>
