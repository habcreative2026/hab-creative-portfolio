name: Build Electron App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            build-command: build:win
            artifact-name: windows-build
          - os: macos-latest
            build-command: build:mac
            artifact-name: macos-build
          - os: ubuntu-latest
            build-command: build:linux
            artifact-name: linux-build

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm-dev \
            libxkbcommon-dev \
            libgbm-dev \
            libasound2-dev \
            libgtk-3-0 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxtst-dev \
            libxss1 \
            libnotify-dev

      - name: Install dependencies
        run: npm install
        working-directory: desktop-app

      - name: Build
        run: npm run ${{ matrix.build-command }}
        working-directory: desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: List dist files
        if: always()
        shell: bash
        run: |
          echo "=== Contents of desktop-app/dist/ ==="
          ls -la desktop-app/dist/ || echo "dist folder not found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            desktop-app/dist/*.exe
            desktop-app/dist/*.dmg
            desktop-app/dist/*.zip
            desktop-app/dist/*.AppImage
            desktop-app/dist/latest*.yml
            desktop-app/dist/*.blockmap
          retention-days: 7
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-files/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: release-files/macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release-files/linux

      - name: List all files
        run: find release-files -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-files/windows/*.exe
            release-files/windows/latest.yml
            release-files/windows/*.blockmap
            release-files/macos/*.dmg
            release-files/macos/*.zip
            release-files/macos/latest-mac.yml
            release-files/macos/*.blockmap
            release-files/linux/*.AppImage
            release-files/linux/latest-linux.yml
            release-files/linux/*.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
