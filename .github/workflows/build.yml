name: Build Electron App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            build-command: build:win
            artifact-name: windows-build
          - os: macos-latest
            build-command: build:mac
            artifact-name: macos-build
          - os: ubuntu-latest
            build-command: build:linux
            artifact-name: linux-build

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libdrm-dev libxkbcommon-dev \
            libgbm-dev libasound2-dev libgtk-3-0 libx11-xcb1 \
            libxcb-dri3-0 libxtst-dev libxss1 libnotify-dev

      - name: Install dependencies
        run: npm install
        working-directory: desktop-app

      - name: Build
        run: npm run ${{ matrix.build-command }}
        working-directory: desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Upload artifacts (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: desktop-app/dist/*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-temp

      - name: List downloaded files
        run: find dist-temp -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist-temp/**/*.exe
            dist-temp/**/*.dmg
            dist-temp/**/*.zip
            dist-temp/**/*.AppImage
            dist-temp/**/*.yml
            dist-temp/**/*.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
